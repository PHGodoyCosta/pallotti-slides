[project]
name = "pallotti-slides"
version = "0.1.0"
description = "Gera os slides da missa de domingo da Paróquia São Cristóvão (tema São Vicente Pallotti)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Pedro Henrique Godoy Costa", email = "phgodoycosta@gmail.com" }
]
dependencies = [
    "PySide6>=6.8",
    "PySide6-Fluent-Widgets",
    "python-pptx>=1.0",
    "lxml",
    "Pillow",
    "pydantic>=2",
    "SQLAlchemy>=2",
    "alembic",
    "anthropic",
    "httpx",
    "beautifulsoup4",
    "rapidfuzz",
    "platformdirs",
    "keyring",
    "typer",
    "openai>=3.37.0",
    "langchain-openai>=1.7.2",
    "langchain-anthropic>=1.7.6",
]

[project.scripts]
pallotti = "pallotti_slides.cli:app"
pallotti-gui = "pallotti_slides.ui.app:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt",
    "respx",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pallotti_slides"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["venv", "src/assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "pallotti_slides.domain",
    "pallotti_slides.domain.*",
    "pallotti_slides.presentation",
    "pallotti_slides.presentation.*",
    "pallotti_slides.songs",
    "pallotti_slides.songs.*",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not live and not soffice"'
markers = [
    "live: usa rede/LLM real (execução manual)",
    "soffice: precisa do LibreOffice instalado",
]
