[project]
name = "gerador-pallotti-slide"
version = "0.1.0"
description = "Programa para geração de slides automáticos com I.A para a Paróquia São Cristóvão"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Pedro Henrique Godoy Costa", email = "phgodoycosta@gmail.com" }
]
dependencies = [
    "flet>=0.86.5"
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "flet-web>=0.86.5",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
org = "com.pallottislide"
product = "pallotti-slide"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"
